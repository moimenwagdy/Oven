  flutter:
    sdk: flutter
  go_router: ^16.2.1
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.2.1
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6
  flutter_localizations:
    sdk: flutter
  intl: any
  carousel_slider: ^5.1.1
  in_app_update: ^4.0.0
  upgrader: ^11.5.0
  package_info_plus: ^8.3.1
  shorebird_code_push: ^2.0.5
  url_launcher: ^6.3.1
  buttons_tabbar:
  motion_tab_bar_v2: any
  shared_preferences: ^2.5.3
  dropdown_button2: any
  video_player: ^2.10.0
  shimmer: ^3.0.0
  auto_size_text: ^3.0.0
  http: ^1.6.0
  fluttertoast: ^9.0.0
  double_back_to_exit: ^1.2.1
  flutter_slidable: ^4.0.3
  image_picker: ^1.1.2




  
